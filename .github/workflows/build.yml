name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux | ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v7

      # Ubuntu 24.04 ships OpenSSL 3.0.
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure
        run: cmake --preset linux -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset linux --parallel

      - name: Test
        run: ctest --preset linux

      - name: Upload library
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: crypto_wrapper-linux-x64
          path: |
            build/linux/libcrypto_wrapper.a
            build/linux/crypto_samples
            include/
          if-no-files-found: error

  windows:
    name: Windows | ${{ matrix.preset }}
    # windows-2022 ships Visual Studio 2022 and vcpkg (VCPKG_INSTALLATION_ROOT).
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-x64, windows-x86]
        include:
          # Cryptography.sln platform name and the matching bin\ folder
          - preset: windows-x64
            slnPlatform: x64
            outdir: x64
          - preset: windows-x86
            slnPlatform: x86
            outdir: Win32

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Cache vcpkg's built OpenSSL between runs (the first build takes several minutes).
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
      - uses: actions/checkout@v7

      # Use the exact registry commit pinned in vcpkg.json (builtin-baseline).
      - name: Set up vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-release --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-release

      # The Visual Studio solution (vs\*.vcxproj) builds the same sources through vcpkg's MSBuild integration.
      - uses: microsoft/setup-msbuild@v3

      - name: Build Visual Studio solution
        run: msbuild Cryptography.sln -m -nologo -verbosity:minimal -p:Configuration=Release -p:Platform=${{ matrix.slnPlatform }}

      - name: Test Visual Studio build
        shell: pwsh
        run: |
          foreach ($exe in 'crypto_tests', 'crypto_samples') {
            & "bin\${{ matrix.outdir }}\Release\$exe.exe"
            if ($LASTEXITCODE -ne 0) { throw "$exe failed with exit code $LASTEXITCODE" }
          }

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: crypto_wrapper-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Release/crypto_wrapper.lib
            build/${{ matrix.preset }}/Release/crypto_samples.exe
            build/${{ matrix.preset }}/Release/*.dll
            include/
          if-no-files-found: error
